services:
  postgres:
    image: postgres:17-alpine
    container_name: outbox-transactional-db
    environment:
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox
      POSTGRES_DB: outbox
    ports:
      - '5445:5432'
    volumes:
      - outbox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U outbox -d outbox']
      interval: 5s
      timeout: 5s
      retries: 10

  pulsar:
    image: apachepulsar/pulsar:4.1.0
    container_name: outbox-transactional-pulsar
    hostname: pulsar
    command: bin/pulsar standalone --no-functions-worker --no-stream-storage
    environment:
      PULSAR_MEM: '-Xms256m -Xmx512m -XX:MaxDirectMemorySize=256m'
    ports:
      - '6650:6650'
      - '8080:8080'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:8080/admin/v2/brokers/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  outbox_pgdata:
